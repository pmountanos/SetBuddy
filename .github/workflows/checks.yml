# Runs the same checks a contributor is asked to run locally (see architecture.md → "Tests and checks")
# on every pull request, and on main after a merge.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The tests use a real SQLite through better-sqlite3, which needs its native binary for this runner.
      - name: Build the SQLite test driver
        run: npm rebuild better-sqlite3

      - name: Unit tests
        run: npx jest

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint
